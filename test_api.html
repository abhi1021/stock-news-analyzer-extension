<!DOCTYPE html>
<html>
<head>
  <title>Gemini API Test</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    #output {
      background: #2a2a2a;
      border: 1px solid #444;
      padding: 15px;
      margin-top: 20px;
      border-radius: 4px;
      white-space: pre-wrap;
      max-height: 500px;
      overflow-y: auto;
    }
    button {
      padding: 10px 20px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #357abd;
    }
    button:disabled {
      background: #666;
      cursor: not-allowed;
    }
    .success { color: #4caf50; }
    .error { color: #f44336; }
    .info { color: #2196f3; }
  </style>
</head>
<body>
  <h1>Gemini API Connection Test</h1>
  <button id="testBtn" onclick="runTest()">Test API Connection</button>
  <div id="output"></div>

  <script src="tools.js"></script>
  <script src="gemini.js"></script>
  <script>
    const output = document.getElementById('output');
    const testBtn = document.getElementById('testBtn');

    function log(message, type = 'info') {
      const timestamp = new Date().toLocaleTimeString();
      const color = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
      output.innerHTML += `<span class="${color}">[${timestamp}] ${message}</span>\n`;
      output.scrollTop = output.scrollHeight;
    }

    async function runTest() {
      testBtn.disabled = true;
      output.innerHTML = '';

      const API_KEY = 'AIzaSyDqvFN9oQRFKL9abjdQHuYTu9zyAMlESzY';

      log('🔄 Testing Gemini API connection...', 'info');
      log(`📡 Using model: ${GEMINI_MODEL}`, 'info');
      log(`🔗 Endpoint: ${GEMINI_ENDPOINT}`, 'info');
      log('─'.repeat(50), 'info');

      try {
        log('📤 Sending test request...', 'info');

        const testContents = [{
          role: "user",
          parts: [{ text: "Say 'Hello, API test successful!' and nothing else." }]
        }];

        const testTools = [{
          name: "dummy_tool",
          description: "A test tool that won't be called",
          parameters: {
            type: "OBJECT",
            properties: {
              test: { type: "STRING" }
            }
          }
        }];

        const response = await callGemini(API_KEY, testContents, testTools, 1);

        log('✅ API call successful!', 'success');
        log('─'.repeat(50), 'info');
        log('📦 Response:', 'success');
        log(JSON.stringify(response, null, 2), 'info');

        const candidate = response.candidates?.[0];
        if (candidate) {
          const text = candidate.content?.parts?.[0]?.text;
          if (text) {
            log('─'.repeat(50), 'info');
            log('💬 Model response:', 'success');
            log(`"${text}"`, 'success');
          }
        }

      } catch (e) {
        log('❌ API call failed!', 'error');
        log('─'.repeat(50), 'error');

        if (e.status === 429) {
          log('⚠️  Rate limit error (429):', 'error');
          log(e.message, 'error');
          log(`⏳ Retry after: ${e.retryAfter}ms`, 'error');
        } else {
          log('Error details:', 'error');
          log(e.message || JSON.stringify(e, null, 2), 'error');
        }
      } finally {
        testBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
